services:
  - type: web
    name: inventory-backend
    runtime: python
    repo: https://github.com/your-username/inventory-system
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app

databases:
  - name: inventory-db
    plan: free
    region: oregon
    databaseName: inventory_db
    user: inventory_user
